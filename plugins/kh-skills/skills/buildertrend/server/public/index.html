<!doctype html>
<title>KH Job Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --ground: #f5f4ef;
    --card: #fdfdfb;
    --ink: #15171c;
    --ink-2: #575b63;
    --ink-3: #8b8e94;
    --line: #e3e1d8;
    --hairline: rgba(21,23,28,0.10);
    --accent: #2450b8;
    --accent-ink: #ffffff;
    --good: #0ca30c; --good-text: #067006;
    --warn: #b97e00;
    --crit: #d03b3b;
    --p0: #2a78d6; --p1: #1baf7a; --p2: #eda100; --p3: #008300;
    --p4: #4a3aa7; --p5: #e34948; --p6: #e87ba4; --p7: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111214;
      --card: #1b1c1f;
      --ink: #f2f2ef;
      --ink-2: #b9bcc2;
      --ink-3: #85888e;
      --line: #2b2c2f;
      --hairline: rgba(255,255,255,0.10);
      --accent: #6f95e8;
      --accent-ink: #0d1730;
      --good: #0ca30c; --good-text: #4cc24c;
      --warn: #e0a11c;
      --crit: #e66767;
      --p0: #3987e5; --p1: #199e70; --p2: #c98500; --p3: #008300;
      --p4: #9085e9; --p5: #e66767; --p6: #d55181; --p7: #d95926;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app { max-width: 640px; margin: 0 auto; padding: 0 14px 96px; }

  /* ---------- title-block chrome ---------- */
  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--ground);
    padding: calc(10px + env(safe-area-inset-top)) 0 8px;
    border-bottom: 1px solid var(--line);
    margin: 0 0 14px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .wordmark { font-weight: 700; font-size: 15px; letter-spacing: 0.14em; }
  .wordmark .slash { color: var(--accent); }
  .sheetno { margin-left: auto; font-size: 10.5px; letter-spacing: 0.12em;
    color: var(--ink-3); text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--ink-3); margin: 22px 2px 8px; font-weight: 600;
  }
  .eyebrow:first-of-type { margin-top: 4px; }

  a.back { color: var(--accent); text-decoration: none; font-size: 13.5px; font-weight: 600; }

  /* ---------- tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 12px 14px 11px;
  }
  .tile .t-label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em;
    text-transform: uppercase; }
  .tile .t-value { font-size: 24px; font-weight: 650; margin-top: 2px; }
  .tile .t-sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; }

  /* ---------- job cards ---------- */
  .jobcard {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 14px 16px 14px; margin-bottom: 10px;
    border-left: 4px solid var(--jc, var(--accent));
  }
  .jobcard:active { filter: brightness(0.97); }
  .jc-head { display: flex; align-items: baseline; gap: 8px; }
  .jc-name { font-size: 17px; font-weight: 650; }
  .jc-client { font-size: 12.5px; color: var(--ink-3); margin-left: auto; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--ground); border: 1px solid var(--line); color: var(--ink-2);
  }
  .chip.ok   { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .chip.crit { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
  .jc-next { font-size: 12.5px; color: var(--ink-2); margin-top: 9px; }
  .jc-next b { font-weight: 600; color: var(--ink); }

  /* progress meter */
  .meter { height: 6px; border-radius: 3px; margin-top: 10px;
    background: color-mix(in srgb, var(--jc, var(--accent)) 18%, transparent);
    position: relative; overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px;
    background: var(--jc, var(--accent)); }

  /* ---------- job screen ---------- */
  .jobtitle { font-size: 21px; font-weight: 700; margin: 2px 0 1px; text-wrap: balance; }
  .jobmeta { font-size: 12.5px; color: var(--ink-2); }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--card); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 9px 11px 8px; }
  .stat .s-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .stat .s-value { font-size: 15.5px; font-weight: 650; margin-top: 1px; white-space: nowrap; }
  .stat .s-value.ok { color: var(--good-text); }
  .stat .s-value.warn { color: var(--warn); }
  .stat .s-value.crit { color: var(--crit); }

  /* ---------- tab bar ---------- */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: center; gap: 2px;
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabs a {
    flex: 1; max-width: 150px; text-align: center; text-decoration: none;
    color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 7px 2px 5px; border-radius: 9px; text-transform: uppercase;
  }
  nav.tabs a .glyph { display: block; font-size: 16px; margin-bottom: 1px; }
  nav.tabs a.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

  /* ---------- schedule / gantt ---------- */
  .gantt { display: grid; grid-template-columns: 132px 1fr; font-size: 11.5px;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 12px 12px 14px; }
  .g-axis { position: relative; height: 22px; border-bottom: 1px solid var(--line); }
  .g-axis span { position: absolute; transform: translateX(-50%); top: 2px;
    font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .g-axis-spacer { border-bottom: 1px solid var(--line); }
  .g-lab { height: 22px; display: flex; align-items: center; padding-right: 8px;
    color: var(--ink-2); overflow: hidden; }
  .g-lab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-lab.phase { font-weight: 650; color: var(--ink); height: 30px; align-items: flex-end; padding-bottom: 6px; }
  .g-plot { position: relative; height: 22px; }
  .g-plot.phase { height: 30px; }
  .g-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: 0.6; }
  .g-bar { position: absolute; top: 6px; height: 10px; border-radius: 3px; min-width: 3px; }
  .g-bar.done { opacity: 0.45; }
  .g-diamond { position: absolute; top: 6px; width: 9px; height: 9px; margin-left: -4.5px;
    background: var(--ink); transform: rotate(45deg); border-radius: 1.5px;
    box-shadow: 0 0 0 2px var(--card); }
  .g-span { position: absolute; bottom: 6px; height: 3px; border-radius: 2px; opacity: 0.5; }
  .g-today { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--crit); }
  .g-todaytag { position: sticky; display: inline-block; font-size: 10px; color: var(--crit);
    font-weight: 650; }
  .legend-note { font-size: 11.5px; color: var(--ink-3); margin: 8px 2px 0; }

  /* ---------- tables ---------- */
  .tablecard { background: var(--card); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 4px 14px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  th { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .sub { display: block; font-size: 11.5px; color: var(--ink-3); }
  .pos { color: var(--good-text); } .neg { color: var(--crit); }

  /* ---------- list rows (selections / activity) ---------- */
  .rowcard { background: var(--card); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 2px 0; }
  .lrow { display: flex; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line);
    align-items: baseline; }
  .lrow:last-child { border-bottom: none; }
  .lrow .l-main { min-width: 0; }
  .lrow .l-title { font-weight: 600; font-size: 14px; }
  .lrow .l-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
  .lrow .l-side { margin-left: auto; text-align: right; flex: none; }
  .lrow .l-val { font-weight: 650; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .lrow .l-when { font-size: 11.5px; color: var(--ink-3); }
  .duechip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .duechip.late { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); }
  .duechip.soon { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .duechip.ok   { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good-text); }
  .duechip.done { background: var(--ground); color: var(--ink-3); }

  .samplenote {
    margin-top: 26px; font-size: 12px; color: var(--ink-3);
    border-top: 1px solid var(--line); padding-top: 12px;
  }
  .samplenote b { color: var(--ink-2); }
  /* ---------- buildertrend-style gantt ---------- */
  .btg { background: var(--card); border-block: 1px solid var(--hairline);
    overflow: auto; -webkit-overflow-scrolling: touch;
    margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
    height: calc(100dvh - 330px); min-height: 340px; }
  .btg-canvas { position: relative; }
  .btg-months { position: sticky; top: 0; z-index: 4; background: var(--card);
    height: 22px; border-bottom: 1px solid var(--line); }
  .btg-month { position: absolute; top: 0; height: 22px; font-size: 10.5px; font-weight: 600;
    color: var(--ink-2); padding: 4px 0 0 6px; border-left: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; }
  .btg-days { position: sticky; top: 22px; z-index: 4; background: var(--card);
    height: 16px; border-bottom: 1px solid var(--line); }
  .btg-corner { position: sticky; left: 0; z-index: 2; width: 150px; height: 100%;
    background: var(--card); border-right: 1px solid var(--line);
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
    display: flex; align-items: center; padding-left: 10px; }
  .btg-day { position: absolute; top: 1px; width: 16px; text-align: center; font-size: 8.5px;
    color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .btg-rows { position: relative; }
  .btg-row { position: relative; height: 26px; }
  .btg-row.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .btg-left { position: sticky; left: 0; z-index: 2; width: 150px; height: 26px;
    background: var(--card); border-right: 1px solid var(--line); padding: 2px 8px 0 10px;
    display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
  .btg-row.sel .btg-left { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .btg-title { font-size: 11px; font-weight: 600; color: var(--ink); line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btg-sub { font-size: 9.5px; color: var(--ink-3); line-height: 1.2; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .btg-bar { position: absolute; top: 7px; height: 12px; border-radius: 3px; min-width: 4px;
    cursor: pointer; touch-action: pan-x; }
  .btg-bar.done { opacity: 0.4; }
  .btg-bar.sel { outline: 2px solid var(--accent); outline-offset: 1px; cursor: grab; touch-action: none; }
  .btg-bar.dragging { cursor: grabbing; opacity: 0.85; }
  .btg-dia { position: absolute; top: 8px; width: 10px; height: 10px; margin-left: -5px;
    background: var(--ink); transform: rotate(45deg); border-radius: 1.5px; cursor: pointer;
    box-shadow: 0 0 0 2px var(--card); }
  .btg-dia.sel { outline: 2px solid var(--accent); outline-offset: 1px; touch-action: none; }
  .btg-name { position: absolute; top: 6px; font-size: 10px; color: var(--ink-2);
    white-space: nowrap; pointer-events: none; }
  .btg-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--crit); z-index: 1; }
  .btg-todaycap { position: absolute; top: -19px; transform: translateX(-50%); font-size: 9px;
    font-weight: 700; color: var(--crit); background: var(--card); padding: 0 3px; }

  /* edit sheet */
  .sheet { position: fixed; z-index: 8; left: 10px; right: 10px; bottom: calc(74px + env(safe-area-inset-bottom));
    max-width: 620px; margin: 0 auto; background: var(--card); border: 1px solid var(--hairline);
    border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,0.22); padding: 12px 14px; font-size: 13px; }
  .sheet .sh-head { display: flex; align-items: baseline; gap: 8px; }
  .sheet .sh-name { font-weight: 700; font-size: 14px; }
  .sheet .sh-dates { color: var(--ink-2); font-size: 12px; margin-left: auto;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sheet .sh-pred { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  .sheet .sh-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .sheet button { font: inherit; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line);
    background: var(--ground); color: var(--ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; }

  .sheet button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .sheet button.danger { color: var(--crit); }
  .sheet .sh-x { margin-left: auto; }
  .sheet label.casc { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    color: var(--ink-2); margin-left: 2px; }
  .changesbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12px;
    color: var(--ink-2); flex-wrap: wrap; }
  .changesbar button { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--line);
    background: var(--card); color: var(--accent); border-radius: 7px; padding: 5px 9px; cursor: pointer; }

  @media (prefers-reduced-motion: no-preference) {
    .jobcard, .tile, .stat { transition: transform 0.08s ease; }
    .jobcard:active { transform: scale(0.99); }
  }
</style>

const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const money = (n) => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString();
const moneyK = (n) => (n < 0 ? "−$" : "$") + (Math.abs(n) >= 1e6 ? (Math.abs(n)/1e6).toFixed(2) + "M" : Math.round(Math.abs(n)/1000) + "K");
const esc = (s) => { const d = document.createElement("span"); d.textContent = s; return d.innerHTML; };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// working-day index -> calendar Date (skips Sat/Sun)
function wdDate(job, wd) {
  if (!job.startDate) return null;
  const d = new Date(job.startDate + "T12:00");
  let n = 0;
  while (n < wd) { d.setDate(d.getDate() + 1); const g = d.getDay(); if (g !== 0 && g !== 6) n++; }
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d;
}
function fmtDay(job, wd, withYear) {
  const d = wdDate(job, wd);
  if (!d) return "wk " + Math.ceil(wd / 5);
  return MONTHS[d.getMonth()] + " " + d.getDate() + (withYear ? " ’" + String(d.getFullYear()).slice(2) : "");
}

function schedule(job) {
  const byId = {};
  for (const [id, name, dur, preds, ph, ov, pct] of job.tasks) {
    let start = 0;
    for (const p of preds) {
      const m = p.match(/^(\d+)(SS)?(?:\+(\d+))?$/);
      const pred = byId[m[1]]; if (!pred) continue;
      start = Math.max(start, (m[2] === "SS" ? pred.start : pred.end) + (m[3] ? +m[3] : 0));
    }
    if (ov != null) start = ov;
    byId[id] = { id, name, dur, preds, ph, start, end: start + dur, pct: pct || 0 };
  }
  const tasks = Object.values(byId);
  return { tasks, total: Math.max(...tasks.map(t => t.end)) };
}

function jobStats(job) {
  const { tasks, total } = schedule(job);
  const est = job.budget.reduce((s, r) => s + r[1], 0);
  const revised = job.budget.reduce((s, r) => s + r[2], 0);
  const actual = job.budget.reduce((s, r) => s + r[4 - 1], 0); // committed col idx 3
  const spent = job.budget.reduce((s, r) => s + r[4], 0);
  const done = tasks.filter(t => t.dur > 0 && t.pct === 100).reduce((s,t) => s + t.dur, 0)
    + tasks.filter(t => t.dur > 0 && t.pct > 0 && t.pct < 100).reduce((s,t) => s + t.dur * t.pct / 100, 0);
  const workdays = tasks.filter(t => t.dur > 0).reduce((s,t) => s + t.dur, 0);
  const selDue = job.selections.filter(s => s[5] === "Pending" && s[4] - job.currentDay <= 14).length;
  const openCOs = job.changeOrders.filter(c => c[3] === "Sent").length;
  return { total, est, revised, spent, committed: actual,
    pctDone: workdays ? Math.round(done / workdays * 100) : 0, selDue, openCOs };
}

    </a>`);
    app.append(card);

  app.append($(`<div class="samplenote"><b>Schedules from Buildertrend exports</b>, updated Jul 2, 2026.

function jobView(slug, tab) {
  const job = JOBS.find(j => j.slug === slug);
  if (!job) return homeView();
  const app = document.getElementById("app");
  app.replaceChildren();
  const s = jobStats(job);

  app.append($(`<header class="top"><a class="back" href="#/">‹ Jobs</a>
    <span class="sheetno">${esc([job.status, job.contractType].filter(Boolean).join(" · "))}</span></header>`));
  const meta = [job.address !== job.name ? job.address : "", job.client].filter(Boolean).join(" · ");
  app.append($(`<div><div class="jobtitle">${esc(job.name)}</div>
    ${meta ? `<div class="jobmeta">${esc(meta)}</div>` : ""}</div>`));

  const deltaCls = job.scheduleDelta < 0 ? "crit" : "ok";
  const grid = $(`<div class="statgrid"></div>`);
  grid.append($(`<div class="stat"><div class="s-label">Schedule</div>
      <div class="s-value ${deltaCls}">${job.scheduleDelta < 0 ? -job.scheduleDelta + "d behind" : "on time"}</div></div>`));
  if (job.jrt != null) {
    const margin = job.jrt - s.revised;
    grid.append(
      $(`<div class="stat"><div class="s-label">Running total</div><div class="s-value">${moneyK(job.jrt)}</div></div>`),
      $(`<div class="stat"><div class="s-label">Proj. margin</div>
          <div class="s-value ${margin >= 0 ? "" : "crit"}">${moneyK(margin)}</div></div>`)
    );
  } else {
    grid.append(
      $(`<div class="stat"><div class="s-label">Complete</div><div class="s-value">${s.pctDone}%</div></div>`),
      $(`<div class="stat"><div class="s-label">${esc(job.nextMilestone.name)}</div>
          <div class="s-value">${esc(fmtDay(job, job.nextMilestone.day, false))}</div></div>`)
    );
  }
  app.append(grid);

  const body = $(`<div></div>`);
  app.append(body);
  if (tab === "budget") budgetTab(body, job);
  else if (tab === "selections") selectionsTab(body, job);
  else if (tab === "activity") activityTab(body, job);
  else scheduleTab(body, job);

  const tabs = $(`<nav class="tabs"></nav>`);
  for (const [key, glyph, label] of [["schedule","▦","Schedule"],["budget","Σ","Budget"],
      ["selections","✓","Selections"],["activity","≡","Activity"]]) {
    tabs.append($(`<a href="#/job/${job.slug}/${key}" class="${tab === key ? "active" : ""}">
      <span class="glyph">${glyph}</span>${label}</a>`));
  }
  app.append(tabs);
}

// ---------- Buildertrend-style editable gantt ----------
const DAYW = 16, LEFTW = 150, EDITS_KEY = "khjobhub-edits-v1";
let SEL = null, CASCADE = true, SCROLLX = null, SCROLLY = null;
let SERVER = false, EDITS = null;
function loadEdits() {
  if (SERVER) return EDITS || {};
  try { return JSON.parse(localStorage.getItem(EDITS_KEY)) || {}; } catch (e) { return {}; }
}
function saveEdits(v) {
  if (SERVER) {
    EDITS = v;
    fetch("api/edits", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(v) }).catch(() => {});
    return;
  }
  try { localStorage.setItem(EDITS_KEY, JSON.stringify(v)); } catch (e) {}
}

function calMaps(job, maxWd) {
  const start = new Date(job.startDate + "T12:00");
  const wd2cal = [0], calWd = [0], calDate = [new Date(start)];
  let d = new Date(start), cal = 0, w = 0;
  while (w < maxWd + 5) {
    d.setDate(d.getDate() + 1); cal++;
    const g = d.getDay();
    calDate[cal] = new Date(d);
    if (g !== 0 && g !== 6) { w++; wd2cal[w] = cal; calWd[cal] = w; }
    else calWd[cal] = -1;
  }
  return { start, wd2cal, calWd, calDate, calTotal: cal };
}

function scheduleTab(root, job) {
  const allEdits = loadEdits(), edits = allEdits[job.slug] || {};
  const base = schedule(job).tasks;
  const tasks = base.map(t => {
    const e = edits[t.id] || {};
    const start = e.start != null ? e.start : t.start;
    const dur = e.dur != null ? e.dur : t.dur;
    return { ...t, start, dur, end: start + dur, baseStart: t.start, baseDur: t.dur,
      predBroken: !!e.predBroken };
  }).sort((x, y) => x.start - y.start || x.id - y.id);
  const totalWd = Math.max(...tasks.map(t => t.end), job.currentDay) + 8;
  const M = calMaps(job, totalWd);

  // inferred finish-to-start links: pred = latest-finishing trade that ends by my start
  for (const t of tasks) {
    let best = null;
    for (const o of tasks) {
      if (o === t || o.end > t.start || o.dur === 0) continue;
      if (!best || o.end > best.end || (o.end === best.end && o.start > best.start)) best = o;
    }
    t.pred = best;
  }
  const chain = (t, out) => {
    out = out || new Set();
    for (const s of tasks) if (s.pred === t && !s.predBroken && !out.has(s)) { out.add(s); chain(s, out); }
    return out;
  };
  const mutate = (list, fn) => {
    const all = loadEdits(); const e = all[job.slug] = all[job.slug] || {};
    for (const x of list) { e[x.id] = e[x.id] || {}; fn(e[x.id], x); }
    saveEdits(all); route();
  };
  const moveBy = (t, dWd) => {
    if (!dWd) return;
    const list = CASCADE ? [t, ...chain(t)] : [t];
    if (list.some(x => x.start + dWd < 0)) return;
    mutate(list, (e, x) => { e.start = x.start + dWd; });
  };

  root.append($(`<div class="eyebrow">Schedule · today ${esc(fmtDay(job, job.currentDay, true))}
    · close ${esc(fmtDay(job, tasks[tasks.length-1].end, true))} · tap a trade, then drag or nudge</div>`));

  const wrap = $(`<div class="btg"></div>`);
  const W = LEFTW + (M.calTotal + 1) * DAYW;
  const canvas = $(`<div class="btg-canvas" style="width:${W}px"></div>`);

  // month header
  const months = $(`<div class="btg-months"></div>`);
  let mStart = 0;
  for (let c = 1; c <= M.calTotal + 1; c++) {
    const prev = M.calDate[c-1], cur = M.calDate[Math.min(c, M.calTotal)];
    if (c > M.calTotal || cur.getMonth() !== prev.getMonth()) {
      months.append($(`<div class="btg-month" style="left:${LEFTW + mStart*DAYW}px;width:${(c-mStart)*DAYW}px">
        ${MONTHS[prev.getMonth()]} ${prev.getFullYear()}</div>`));
      mStart = c;
    }
  }
  months.prepend($(`<div class="btg-corner">Trade</div>`));
  canvas.append(months);
  // day numbers (today highlighted red so the date is visible while scrolling)
  const days = $(`<div class="btg-days"></div>`);
  for (let c = 0; c <= M.calTotal; c++) {
    const isToday = c === M.wd2cal[job.currentDay];
    days.append($(`<div class="btg-day" style="left:${LEFTW + c*DAYW}px${isToday ? ";color:var(--crit);font-weight:700" : ""}">${M.calDate[c].getDate()}</div>`));
  }
  days.prepend($(`<div class="btg-corner"></div>`));
  canvas.append(days);

  // rows with weekend shading
  const rows = $(`<div class="btg-rows"></div>`);
  const satOff = (6 - M.start.getDay() + 7) % 7;
  rows.style.background = `repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 5%, transparent) 0, color-mix(in srgb, var(--ink) 5%, transparent) ${2*DAYW}px, transparent ${2*DAYW}px, transparent ${7*DAYW}px)`;
  rows.style.backgroundPositionX = (LEFTW + satOff * DAYW) + "px";

  const todayCal = M.wd2cal[job.currentDay];
  for (const t of tasks) {
    const row = $(`<div class="btg-row ${SEL === t.id ? "sel" : ""}"></div>`);
    const name = t.name.replace("MILESTONE: ", "");
    const left = $(`<div class="btg-left"><div class="btg-title">${esc(name)}</div>
      <div class="btg-sub">${esc(fmtDay(job, t.start, true))}${t.dur ? " · " + t.dur + "d" : ""}</div></div>`);
    left.addEventListener("click", () => { SEL = SEL === t.id ? null : t.id; SCROLLX = wrap.scrollLeft; SCROLLY = wrap.scrollTop; route(); });
    row.append(left);
    const calS = M.wd2cal[t.start];
    let mark, right;
    if (t.dur === 0) {
      mark = $(`<div class="btg-dia ${SEL === t.id ? "sel" : ""}" style="left:${LEFTW + calS*DAYW + DAYW/2}px"></div>`);
      right = LEFTW + calS*DAYW + DAYW;
    } else {
      const calE = M.wd2cal[t.start + t.dur - 1] + 1;
      mark = $(`<div class="btg-bar ${t.pct === 100 ? "done" : ""} ${SEL === t.id ? "sel" : ""}"
        style="left:${LEFTW + calS*DAYW}px;width:${(calE - calS)*DAYW - 2}px;background:var(--p${t.ph})"></div>`);
      right = LEFTW + calE*DAYW;
    }
    if (SEL !== t.id) {
      mark.addEventListener("click", () => { SEL = t.id; SCROLLX = wrap.scrollLeft; SCROLLY = wrap.scrollTop; route(); });
    } else {
      // drag to move (selected only, so page panning still works elsewhere)
      let sx = null, dx = 0, moved = false;
      mark.addEventListener("pointerdown", ev => {
        sx = ev.clientX; dx = 0; moved = false;
        mark.setPointerCapture(ev.pointerId); mark.classList.add("dragging");
        ev.preventDefault();
      });
      mark.addEventListener("pointermove", ev => {
        if (sx == null) return; dx = ev.clientX - sx;
        if (Math.abs(dx) > 4) moved = true;
        mark.style.transform = `translateX(${Math.round(dx / DAYW) * DAYW}px)`;
      });
      const drop = () => {
        if (sx == null) return;
        const dCal = Math.round(dx / DAYW); sx = null;
        mark.classList.remove("dragging"); mark.style.transform = "";
        if (!moved) { SEL = null; SCROLLX = wrap.scrollLeft; SCROLLY = wrap.scrollTop; route(); return; }
        if (!dCal) return;
        let target = Math.max(0, Math.min(M.calTotal, M.wd2cal[t.start] + dCal));
        let wdNew = -1;
        for (let k = 0; k < 5 && wdNew < 0; k++) {
          if (M.calWd[target + k] >= 0) wdNew = M.calWd[target + k];
          else if (target - k >= 0 && M.calWd[target - k] >= 0) wdNew = M.calWd[target - k];
        }
        SCROLLX = wrap.scrollLeft; SCROLLY = wrap.scrollTop;
        if (wdNew >= 0) moveBy(t, wdNew - t.start);
      };
      mark.addEventListener("pointerup", drop);
      mark.addEventListener("pointercancel", drop);
    }
    row.append(mark);
    row.append($(`<div class="btg-name" style="left:${right + 6}px">${esc(name)}</div>`));
    rows.append(row);
  }
  if (todayCal != null) {
    rows.append($(`<div class="btg-today" style="left:${LEFTW + todayCal*DAYW + DAYW/2}px"></div>`));
  }
  canvas.append(rows);
  wrap.append(canvas);
  root.append(wrap);

  // changes bar
  const changed = tasks.filter(t => t.start !== t.baseStart || t.dur !== t.baseDur || t.predBroken);
  if (changed.length) {
    const bar = $(`<div class="changesbar"><span><b>${changed.length}</b> ${SERVER ? "shared" : "local"} change${changed.length>1?"s":""}${SERVER ? " (everyone sees these)" : " on this device"}</span></div>`);
    const copyBtn = $(`<button>Copy for Claude</button>`);
    copyBtn.addEventListener("click", () => {
      const txt = job.name + " schedule changes:\n" + changed.map(t =>
        `- ${t.name.replace("MILESTONE: ","")}: ` +
        (t.start !== t.baseStart ? `moved ${fmtDay(job, t.baseStart, true)} → ${fmtDay(job, t.start, true)}` : "") +
        (t.dur !== t.baseDur ? ` duration ${t.baseDur}→${t.dur}d` : "") +
        (t.predBroken ? " (link broken)" : "")).join("\n");
      if (navigator.clipboard) navigator.clipboard.writeText(txt);
      copyBtn.textContent = "Copied ✓";
    });
    const resetBtn = $(`<button>Reset all</button>`);
    resetBtn.addEventListener("click", () => {
      const all = loadEdits(); delete all[job.slug]; saveEdits(all); SEL = null; route();
    });
    bar.append(copyBtn, resetBtn);
    root.append(bar);
  }
  root.append($(`<div class="legend-note">Red line = today. Moves cascade through the linked trades after
    (uncheck “move linked too” to move one trade alone; “break link” frees a trade from its predecessor).
    ${SERVER ? "Edits save to the KH server — everyone sees the same schedule."
             : "Edits save on this device — “Copy for Claude” to make them permanent for everyone."}</div>`));

  // edit sheet
  const selTask = tasks.find(t => t.id === SEL);
  if (selTask) {
    const t = selTask;
    const endLbl = t.dur ? `${fmtDay(job, t.start, false)} – ${fmtDay(job, t.start + t.dur - 1, true)} · ${t.dur}d`
      : fmtDay(job, t.start, true);
    const sheet = $(`<div class="sheet"></div>`);
    sheet.append($(`<div class="sh-head"><span class="sh-name">${esc(t.name.replace("MILESTONE: ",""))}</span>
      <span class="sh-dates">${esc(endLbl)}</span></div>`));
    const nLinked = chain(t).size;
    sheet.append($(`<div class="sh-pred">${t.pred
      ? (t.predBroken ? "Link to “" + esc(t.pred.name.replace("MILESTONE: ","")) + "” broken — moves independently"
                      : "Follows “" + esc(t.pred.name.replace("MILESTONE: ","")) + "”")
      : "No predecessor"} · ${nLinked} linked trade${nLinked===1?"":"s"} after</div>`));
    const btn = (label, fn, cls) => { const b = $(`<button class="${cls||""}">${label}</button>`);
      b.addEventListener("click", () => { const g = document.querySelector(".btg");
        if (g) { SCROLLX = g.scrollLeft; SCROLLY = g.scrollTop; } fn(); }); return b; };
    const r1 = $(`<div class="sh-row"></div>`);
    r1.append(
      btn("◀ 1d", () => moveBy(t, -1)),
      btn("1d ▶", () => moveBy(t, 1)),
      btn("◀ 1wk", () => moveBy(t, -5)),
      btn("1wk ▶", () => moveBy(t, 5))
    );
    if (t.dur > 0) r1.append(
      btn("− dur", () => { if (t.dur <= 1) return;
        const list = CASCADE ? [...chain(t)] : [];
        const all = loadEdits(); const e = all[job.slug] = all[job.slug] || {};
        (e[t.id] = e[t.id] || {}).dur = t.dur - 1;
        for (const x of list) (e[x.id] = e[x.id] || {}).start = x.start - 1;
        saveEdits(all); route(); }),
      btn("+ dur", () => {
        const list = CASCADE ? [...chain(t)] : [];
        const all = loadEdits(); const e = all[job.slug] = all[job.slug] || {};
        (e[t.id] = e[t.id] || {}).dur = t.dur + 1;
        for (const x of list) (e[x.id] = e[x.id] || {}).start = x.start + 1;
        saveEdits(all); route(); })
    );
    const r2 = $(`<div class="sh-row"></div>`);
    if (t.pred) r2.append(btn(t.predBroken ? "Relink" : "Break link",
      () => mutate([t], e => { e.predBroken = !t.predBroken; }), "danger"));
    const casc = $(`<label class="casc"><input type="checkbox" ${CASCADE ? "checked" : ""}> move linked too</label>`);
    casc.querySelector("input").addEventListener("change", ev => { CASCADE = ev.target.checked; });
    r2.append(casc);
    r2.append(btn("Done", () => { SEL = null; route(); }, "primary sh-x"));
    sheet.append(r1, r2);
    root.append(sheet);
  }

  // restore scroll (or bring today + the active trades into view on first open)
  const firstActive = Math.max(0, tasks.findIndex(t => t.pct < 100));
  requestAnimationFrame(() => {
    wrap.scrollLeft = SCROLLX != null ? SCROLLX
      : Math.max(0, LEFTW + (todayCal || 0) * DAYW - wrap.clientWidth * 0.55);
    wrap.scrollTop = SCROLLY != null ? SCROLLY : Math.max(0, firstActive * 26 - 90);
    SCROLLX = null; SCROLLY = null;
  });
}

function budgetTab(root, job) {
  root.append($(`<div class="eyebrow">Budget by division</div>`));
  if (!job.budget.length) {
    root.append($(`<div class="rowcard"><div class="lrow"><div class="l-main">
      <div class="l-title">No budget data yet</div>
      <div class="l-sub">Add a budget.md to this job's folder in the KH vault (or give Claude the
      numbers) and refresh the Job Hub — estimate, committed, actual, and variance land here.</div>
      </div></div></div>`));
    return;
  }
  const card = $(`<div class="tablecard"></div>`);
  const table = $(`<table><tr><th>Division</th><th class="num">Revised</th><th class="num">Actual</th><th class="num">Var.</th></tr></table>`);
  let tE = 0, tR = 0, tC = 0, tA = 0;
  for (const [name, est, revised, committed, actual] of job.budget) {
    tE += est; tR += revised; tC += committed; tA += actual;
    const v = revised - Math.max(committed, actual);
    const settled = actual >= committed && committed > 0 && actual > 0;
    const varTxt = committed === 0 ? "—" :
      `<span class="${(settled ? revised - actual : v) >= 0 ? "pos" : "neg"}">${money(settled ? revised - actual : v)}</span>`;
    table.append($(`<tr><td>${esc(name)}${est !== revised ? `<span class="sub">est. ${money(est)} → revised</span>` : ""}</td>
      <td class="num">${money(revised)}</td><td class="num">${actual ? money(actual) : "—"}</td>
      <td class="num">${varTxt}</td></tr>`));
  }
  table.append($(`<tr><td><b>Total</b><span class="sub">committed ${money(tC)}</span></td>
    <td class="num"><b>${money(tR)}</b></td><td class="num"><b>${money(tA)}</b></td>
    <td class="num"><b class="${tR - tC >= 0 ? "pos" : "neg"}">${money(tR - tC)}</b></td></tr>`));
  card.append(table);
  root.append(card);
  root.append($(`<div class="legend-note">Var. = revised budget minus committed/actual, per division.
    Revised = estimate + approved change orders + selection overages.</div>`));
}

function selectionsTab(root, job) {
  root.append($(`<div class="eyebrow">Selections & allowances</div>`));
  if (!job.selections.length) {
    root.append($(`<div class="rowcard"><div class="lrow"><div class="l-main">
      <div class="l-title">No selections tracked</div>
      <div class="l-sub">Add a selections.md to this job's folder and refresh — allowances,
      deadlines, and over/under land here.</div></div></div></div>`));
    return;
  }
  const card = $(`<div class="rowcard"></div>`);
  const rows = [...job.selections].sort((a, b) =>
    (a[5] === "Pending" ? 0 : 1) - (b[5] === "Pending" ? 0 : 1) || a[4] - b[4]);
  for (const [item, room, allowance, price, deadline, status] of rows) {
    const daysLeft = deadline - job.currentDay;
    let chip;
    if (status !== "Pending") chip = `<span class="duechip done">decided</span>`;
    else if (daysLeft < 0) chip = `<span class="duechip late">${-daysLeft}d late</span>`;
    else if (daysLeft <= 14) chip = `<span class="duechip soon">due in ${daysLeft}d</span>`;
    else chip = `<span class="duechip ok">wk ${Math.ceil(deadline/5)}</span>`;
    const delta = price != null && allowance > 0 ? price - allowance : null;
    const val = status === "Pending"
      ? (allowance ? "allow. " + moneyK(allowance) : "no allowance")
      : delta == null || delta === 0 ? "at allowance"
      : `<span class="${delta > 0 ? "neg" : "pos"}">${delta > 0 ? "+" : ""}${money(delta)} vs allow.</span>`;
    card.append($(`<div class="lrow"><div class="l-main"><div class="l-title">${esc(item)}</div>
      <div class="l-sub">${esc(room)}</div></div>
      <div class="l-side"><div class="l-val">${val}</div><div class="l-when">${chip}</div></div></div>`));
  }
  root.append(card);
  root.append($(`<div class="legend-note">Deadlines are tied to schedule tasks and move when the
    schedule shifts. Overages roll into the budget and next draw.</div>`));
}

function activityTab(root, job) {
  if (job.changeOrders.length) {
    root.append($(`<div class="eyebrow">Change orders</div>`));
    const card = $(`<div class="rowcard"></div>`);
    for (const [no, title, amt, status, date] of job.changeOrders) {
      const chip = status === "Approved" ? `<span class="duechip ok">approved</span>`
        : status === "Sent" ? `<span class="duechip soon">awaiting client</span>`
        : `<span class="duechip done">${esc(status.toLowerCase())}</span>`;
      card.append($(`<div class="lrow"><div class="l-main"><div class="l-title">${esc(no)} · ${esc(title)}</div>
        <div class="l-sub">${esc(date)}</div></div>
        <div class="l-side"><div class="l-val">${money(amt)}</div><div class="l-when">${chip}</div></div></div>`));
    }
    root.append(card);
  }
  root.append($(`<div class="eyebrow">Recent daily logs</div>`));
  const card = $(`<div class="rowcard"></div>`);
  for (const [date, note] of job.logs) {
    card.append($(`<div class="lrow"><div class="l-main"><div class="l-title">${esc(date)}</div>
      <div class="l-sub">${esc(note)}</div></div></div>`));
  }
  root.append(card);
}

/* ---------------- router ---------------- */
function route() {
  const h = location.hash || "#/";
  const m = h.match(/^#\/job\/([^/]+)\/?([^/]*)/);
  if (m) jobView(m[1], m[2] || "schedule");
  else homeView();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
(async function boot() {
  try {
    const r = await fetch("api/jobs", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      if (Array.isArray(d.jobs)) { JOBS = d.jobs; GENERATED = d.generated || GENERATED; SERVER = true; }
    }
  } catch (e) {}
  if (SERVER) {
    try { const r = await fetch("api/edits", { cache: "no-store" }); EDITS = r.ok ? await r.json() : {}; }
    catch (e) { EDITS = {}; }
  }
  route();
})();
</script>
